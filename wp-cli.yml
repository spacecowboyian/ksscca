# wp-cli configuration for ksscca.org
#
# Run commands against the live site through WP Engine's SSH gateway:
#   bin/wp @prod post list --post_type=page --fields=ID,post_title
#
# The WP Engine install is named `kansasregion` — the gateway hostname, SSH
# user, and site path all derive from it. Confirmed via wp-admin (WP Engine
# menu) and DNS: kansasregion.ssh.wpengine.net resolves.
#
# Setup steps and troubleshooting: docs/wp-cli.md

@prod:
  ssh: kansasregion@kansasregion.ssh.wpengine.net
  path: /sites/kansasregion

@staging:
  ssh: kansasregionstg@kansasregionstg.ssh.wpengine.net
  path: /sites/kansasregionstg

# Never let a destructive command run against prod without being asked twice.
disabled_commands:
  - db drop
  - db reset
  - site empty

# wp-cli configuration for ksscca.org
#
# Run commands against the live site through WP Engine's SSH gateway:
#   bin/wp @prod post list --post_type=page --fields=ID,post_title
#
# Replace INSTALL_NAME below with the WP Engine install name (visible in the
# WP Engine portal, or in wp-admin under the WP Engine menu). The gateway
# hostname, SSH user, and site path are all derived from it.
#
# Setup steps and troubleshooting: docs/wp-cli.md

@prod:
  ssh: INSTALL_NAME@INSTALL_NAME.ssh.wpengine.net
  path: /sites/INSTALL_NAME

@staging:
  ssh: INSTALL_NAMEstg@INSTALL_NAMEstg.ssh.wpengine.net
  path: /sites/INSTALL_NAMEstg

# Never let a destructive command run against prod without being asked twice.
disabled_commands:
  - db drop
  - db reset
  - site empty

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --ink:#14181c;
  --paper:#ffffff;
  --page:#c5ccd5;
  --row-alt:#eef2f7;
  --hover:#eef3fa;
  --accent:#0b3d91;
  --accent-dark:#082a66;
  --border:#ccd3da;
  --hair:#e2e7ed;
  --muted:#5b6470;
  --faint:#98a2ad;
  --good:#0a7d2c;
  --bad:#b30000;
  --gold:#c9a227;
  --gold-text:#8a6d00;
  --gold-tint-light:#fdf4dd;
  --invert:#2c3238;
  --invert-ink:#f4f7fa;
  --invert-dim:#b6bfc8;
  --gold-on-dark:#e8c14e;
  --good-on-dark:#6fcf8b;

  /* One padding value governs an entry: the run strip and the penalty line
     begin at the same left edge as the position badge, and the gap between
     wrapped chip rows matches the gap between chips. */
  /* Class headings and driver rows are separate grid containers, so an auto
     column in one has no idea how wide the same column is in the other.
     Fixing every column but the name keeps them on the same vertical lines. */
  --col-rank:24px;
  --col-gap:84px;
  --col-total:92px;

  --pad-x:14px;
  --pad-y:12px;
  --gap:6px;

  --bar-h:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:clamp(15px,3.6vw,16px);
  line-height:1.35;
}
.wrap{max-width:1080px;margin:0 auto;background:var(--paper);min-height:100vh;
  border-left:1px solid #aab3bf;border-right:1px solid #aab3bf}
button{font:inherit;color:inherit}

/* ---------------------------------------------------------------- header */
.head{background:var(--accent);color:#fff;padding:18px var(--pad-x) 16px}
.head h1{margin:0;font-size:clamp(19px,4.8vw,26px);line-height:1.2;letter-spacing:-.01em}
.head .sub{margin-top:5px;font-size:clamp(13px,3.4vw,15px);color:#c3d3f0}
.badges{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:4px 8px;background:var(--accent-dark);color:#dce6f8;
}
.badge.warn{background:#8a6d00;color:#fff8dd}

/* ------------------------------------------------------------------ bars */
.bar{
  display:flex;
  background:var(--paper);border-bottom:1px solid var(--border);
}
.tab{
  flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
  font-weight:600;color:var(--muted);
  height:var(--bar-h);border-bottom:3px solid transparent;
}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.tools{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:8px var(--pad-x);
  background:var(--paper);border-bottom:1px solid var(--border);
}
.tools input[type=search],.tools select{
  padding:8px 10px;border:1px solid var(--border);
  background:var(--paper);color:var(--ink);min-width:0;
}
.tools input[type=search]{flex:1 1 180px}
/* The native control draws a small caret hard against the edge; this gives
   it room to breathe. */
.tools select{
  flex:0 1 auto;
  appearance:none;-webkit-appearance:none;
  padding-right:38px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%235b6470'%3E%3Cpath d='M8 11.5L2.5 5.6 3.9 4.3 8 8.7l4.1-4.4 1.4 1.3z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 12px center;
  background-size:14px 14px;
}
.toggle{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-size:13px;color:var(--muted);white-space:nowrap;user-select:none;
}
.count{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:auto}

/* --------------------------------------------------------------- classes */
.cls{border-bottom:1px solid var(--border)}
.cls:last-child{border-bottom:0}

/* The class header doubles as the control that opens every driver in the
   class, and carries the class's summary figures. */
.cls-head{
  display:grid;
  grid-template-columns:var(--col-rank) minmax(0,1fr) auto;
  align-items:center;
  gap:0 10px;
  width:100%;text-align:left;cursor:pointer;
  border:0;border-bottom:1px solid var(--border);
  background:var(--row-alt);
  /* No top padding: the chip runs to the top edge of the heading like a
     tab, and the class name centres against it rather than sitting on its
     own baseline. */
  padding:0 var(--pad-x) 0 0;
  position:sticky;top:0;z-index:10;
}
.cls-head:hover{background:#e6ecf4}
.cls-code{
  grid-column:1;grid-row:1 / -1;justify-self:stretch;align-self:stretch;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  color:#fff;background:var(--accent);
  width:100%;text-align:center;
}
.cls-main{grid-column:2;grid-row:1;min-width:0;padding:9px 0}
.cls-name{font-weight:600}
.cls-n{grid-column:3;grid-row:1;color:var(--muted);font-size:13px;text-align:right}
.cls-stats{
  margin-top:4px;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;
  display:flex;flex-wrap:wrap;gap:3px 14px;
}
.cls-stats b{color:var(--ink);font-weight:600}

/* ----------------------------------------------------------------- entry */
.entry{border-bottom:1px solid var(--hair)}
.entry:last-child{border-bottom:0}
/* A linked-to driver inverts rather than being washed yellow. Every colour
   in the row is restated for the dark ground, including the trophy gold,
   which swaps to the lighter tone that only works on dark. */
.entry:target{background:var(--invert)}
.entry:target:hover{background:var(--invert)}
.entry:target .name,
.entry:target .total,
.entry:target .rank{color:var(--invert-ink)}
.entry:target .car,
.entry:target .gap,
.entry:target .cls-n,
.entry:target .foot-line{color:var(--invert-dim)}
.entry:target .foot-line b{color:var(--invert-ink)}
.entry:target .rank.trophy{color:var(--gold-on-dark)}
.entry:target .run.win{background:#3d3417;border-color:#6b5a24;color:var(--gold-on-dark)}
.entry:target .gap.lead{color:var(--good-on-dark)}
.entry:target .linkbtn{color:var(--invert-dim)}
.entry:target .linkbtn:hover{color:var(--invert-ink)}

/* Every entry shares one column template, so badges, names and times line
   up down the page exactly as a table would, while still reflowing. */
.entry-head{
  display:grid;
  grid-template-columns:var(--col-rank) minmax(0,1fr) auto;
  align-items:baseline;
  gap:var(--gap) 10px;
  width:100%;text-align:left;cursor:pointer;
  background:none;border:0;
  padding:var(--pad-y) var(--pad-x) var(--pad-y) 0;
}
/* The whole entry highlights, header and expanded body together - a row
   that is open should not have its runs sitting on a different ground
   from the name above them. */
.entry:hover{background:var(--hover)}
.entry.static .entry-head{cursor:default}
.entry.static:hover{background:none}

/* No box: the number carries the meaning on its own, and dropping the
   border reclaims the width it was costing. --gold is too light to read as
   text on white (about 2.3:1), so trophy positions use a darkened gold that
   clears AA while staying recognisably the same colour. */
.rank{
  grid-column:1;grid-row:1;justify-self:stretch;text-align:center;
  font-size:14px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.rank.trophy{color:var(--gold-text)}

/* These are spans so they can live inside the header button, so they need
   block display back to stack the way the layout expects. */
.who{grid-row:1;display:block;min-width:0}
.name,.car,.total,.gap{display:block}
.car{display:flex;align-items:center;gap:6px;min-width:0}
.cartext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Both controls appear only once a row is open. Hidden they take no space
   at all rather than sitting at zero opacity, so a collapsed row gives its
   full width to the car name. */
.linkbtn,.cmpbtn{
  display:none;flex:none;align-self:center;
  appearance:none;border:0;background:none;padding:2px;cursor:pointer;
  line-height:0;color:var(--faint);text-decoration:none;
}
.entry.open .linkbtn,
.entry.open .cmpbtn{display:inline-flex}
/* The glyphs have different viewBoxes, so each gets its own size. */
.linkbtn svg{width:15px;height:12px;fill:currentColor;display:block}
.cmpbtn svg{width:12px;height:12px;fill:currentColor;display:block}
.linkbtn:hover,.cmpbtn:hover{color:var(--accent)}
.cmpbtn.on{color:var(--good)}
.linkbtn:focus-visible,.cmpbtn:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}

.times{grid-row:1;display:block;text-align:right;min-width:96px}
.totline{display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
/* An equation needs more room than a bare time, and it must not be split
   across the grid, so these rows keep .times as one right-aligned block. */
.entry-head.has-eq .times{min-width:152px}
.eq{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.eq-op{margin:0 3px;color:var(--faint)}
.total{font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(15px,3.8vw,17px)}
.gap{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gap.lead{color:var(--good);font-weight:600}
.gap.nostart{color:var(--faint);font-weight:600;letter-spacing:.04em}

/* Body carries the same left edge as the badge above it. */
.entry-body{padding:0 var(--pad-x) var(--pad-y) calc(var(--col-rank) + 10px)}
.entry:not(.open) .entry-body{display:none}

/* Run strip: chips carry their own run number, so a wrap never separates a
   time from the run it belongs to, and the grid keeps R1 under R1 across
   every driver. No breakpoint is involved. */
.strip{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:var(--gap);
}
.run{
  display:flex;align-items:baseline;gap:5px;
  padding:3px 7px;font-size:13px;font-variant-numeric:tabular-nums;
  background:var(--row-alt);border:1px solid var(--hair);color:var(--ink);
}
.run .n{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.run .p{font-size:10px;font-weight:700;color:var(--bad)}
.run.best{background:#e2f5e8;border-color:#a9dcbb;color:var(--good);font-weight:700}
.run.best .n{color:#5c9a72}
.run.pen{background:#fdece1;border-color:#f0c9ae}
.run.pen .n{color:#a9724a}
.run.dnf{background:#fde8e8;border-color:#f0b8b8}
.run.dnf .n{color:#a86060}

.foot-line{
  margin-top:var(--gap);display:flex;flex-wrap:wrap;align-items:baseline;
  gap:4px 14px;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.foot-line b{color:var(--ink);font-weight:600}
/* Once there is width to spare, the row collapses from two lines to one:
   the car joins the name, and the gap moves left of the total so the time
   people look for stays hard against the right edge. .times becomes
   display:contents so its two children join the row's own grid. */
@media (min-width:760px){
  .entry-head{
    grid-template-columns:var(--col-rank) minmax(0,1fr) var(--col-gap)
                         var(--col-total);
    gap:0 10px;
    padding:7px var(--pad-x) 7px 0;
  }
  /* Every item is pinned explicitly: with .times becoming display:contents,
     leaving any of them to auto-placement puts them in the wrong order. */
  .rank{grid-row:1;grid-column:1;font-size:13px}
  .total{min-width:0}
  .who{grid-row:1;grid-column:2;display:flex;align-items:baseline;gap:10px;min-width:0}
  .name{flex:0 0 auto}
  .car{flex:1 1 auto;min-width:0;font-size:12.5px}
  .times{display:contents}
  /* ...except where a row ends in an equation, which spans the two
     right-hand columns as a single cell instead. */
  .entry-head.has-eq .times{
    display:block;grid-row:1;grid-column:3 / span 2;
    text-align:right;min-width:0;
  }
  .gap{grid-row:1;grid-column:3;text-align:right;white-space:nowrap;font-size:12.5px}
  .total{grid-row:1;grid-column:4;text-align:right;min-width:88px;font-size:16px}

  /* The class heading collapses the same way a driver row does: the stats
     join the class name instead of taking a second line. .cls-title becomes
     display:contents so its children become flex items of the heading, and
     every one is given an explicit order. */
  .cls-head{
    grid-template-columns:var(--col-rank) minmax(0,1fr) var(--col-gap)
                         var(--col-total);
  }
  .cls-main{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .cls-stats{margin-top:0}
  .cls-n{grid-column:4}
}

/* On a phone the first column is pure marker - a class code and a position
   number - so it gives up the page's left padding and sits against the edge
   of the screen. The name column starts ~19px earlier as a result, which is
   width the driver and car names actually use. */
@media (max-width:759px){
  /* The sheet's side rules only exist to separate it from the surround on a
     wide screen; below that the sheet fills the viewport, so they are just a
     hairline keeping the class chip off the edge. */

  .cls-head,
  .entry-head{gap:var(--gap) 8px}

  .entry-body{padding-left:calc(var(--col-rank) + 8px)}
}

/* -------------------------------------------------------------- compare */
.run.win{background:var(--gold-tint-light);border-color:#dcc68a;
  color:var(--gold-text);font-weight:700}
.run.win .n{color:#a08340}

.pane-note{padding:12px var(--pad-x) 18px 0;font-size:12.5px;color:var(--muted)}
.cmp-clear{padding:12px var(--pad-x) 18px 0}
.cmp-clear-btn{
  appearance:none;border:1px solid var(--border);background:var(--paper);
  color:var(--muted);font-size:12.5px;font-weight:600;
  padding:6px 12px;cursor:pointer;
}
.cmp-clear-btn:hover{color:var(--bad);border-color:var(--bad)}

/* ------------------------------------------------------------------ misc */
.pane[hidden]{display:none}
.foot{padding:16px var(--pad-x) 26px;font-size:13px;color:var(--muted);border-top:1px solid var(--border)}
.foot h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;color:var(--ink)}
.foot ul{margin:0 0 14px;padding-left:18px}
.foot li{margin-bottom:4px}
.key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
@media (prefers-reduced-motion:reduce){
  .linkbtn,.cmpbtn{transition:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <h1 id="ev-title"></h1>
    <div class="sub" id="ev-sub"></div>
    <div class="badges" id="ev-badges"></div>
  </header>

  <div class="bar" role="tablist">
    <button class="tab" id="tab-class" role="tab" aria-selected="true" aria-controls="pane-class">Class Results</button>
    <button class="tab" id="tab-raw"   role="tab" aria-selected="false" aria-controls="pane-raw">Raw Times</button>
    <button class="tab" id="tab-pax" role="tab" aria-selected="false" aria-controls="pane-pax" hidden>PAX</button>
    <button class="tab" id="tab-compare" role="tab" aria-selected="false" aria-controls="pane-compare" hidden>Compare</button>
  </div>

  <div class="tools">
    <input id="q" type="search" placeholder="Search driver, car or number" autocomplete="off" aria-label="Search">
    <select id="clsfilter" aria-label="Filter by class"></select>
    <label class="toggle"><input type="checkbox" id="showruns"> Runs</label>
    <span class="count" id="count"></span>
  </div>

  <main>
    <section class="pane" id="pane-class" role="tabpanel" aria-labelledby="tab-class"></section>
    <section class="pane" id="pane-raw" role="tabpanel" aria-labelledby="tab-raw" hidden></section>
    <section class="pane" id="pane-pax" role="tabpanel" aria-labelledby="tab-pax" hidden></section>
    <section class="pane" id="pane-compare" role="tabpanel" aria-labelledby="tab-compare" hidden></section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script type="application/json" id="event-data">__EVENT_JSON__</script>
<script>
(function(){
"use strict";

var DATA = JSON.parse(document.getElementById("event-data").textContent);
var EV = DATA.event;
var RALLYX = EV.scoring === "rallyx_sum";
/* Font Awesome Free 6 "link" (solid), inlined so the page stays
   self-contained. Icons are CC BY 4.0 - fontawesome.com/license/free */
var PLUS_ICON = '<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M256 80' +
  'c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192' +
  'V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32' +
  'H256V80z"/></svg>';
var CHECK_ICON = '<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M438.6 105.4' +
  'c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5' +
  '-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>';
var LINK_ICON = '<svg viewBox="0 0 640 512" aria-hidden="true">' +
  '<path d="M579.8 267.7c56.5-56.5 56.5-148 0-204.5c-50-50-128.8-56.5-186.3-15.4' +
  'l-1.6 1.1c-14.4 10.3-17.7 30.3-7.4 44.6s30.3 17.7 44.6 7.4l1.6-1.1c32.1-22.9 ' +
  '76-19.3 103.8 8.6c31.5 31.5 31.5 82.5 0 114L422.3 334.8c-31.5 31.5-82.5 31.5-114 0' +
  'c-27.9-27.9-31.5-71.8-8.6-103.8l1.1-1.6c10.3-14.4 6.9-34.4-7.4-44.6s-34.4-6.9-44.6 7.4' +
  'l-1.1 1.6C206.5 251.2 213 330 263 380c56.5 56.5 148 56.5 204.5 0L579.8 267.7z' +
  'M60.2 244.3c-56.5 56.5-56.5 148 0 204.5c50 50 128.8 56.5 186.3 15.4l1.6-1.1' +
  'c14.4-10.3 17.7-30.3 7.4-44.6s-30.3-17.7-44.6-7.4l-1.6 1.1c-32.1 22.9-76 19.3-103.8-8.6' +
  'C74 372 74 321 105.5 289.5L217.7 177.2c31.5-31.5 82.5-31.5 114 0c27.9 27.9 31.5 71.8 8.6 103.9' +
  'l-1.1 1.6c-10.3 14.4-6.9 34.4 7.4 44.6s34.4 6.9 44.6-7.4l1.1-1.6C433.5 260.8 427 182 377 132' +
  'c-56.5-56.5-148-56.5-204.5 0L60.2 244.3z"/></svg>';

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function fmt(t){ return t == null ? "—" : t.toFixed(3); }
function signed(t){ return (t > 0 ? "+" : "") + t.toFixed(3); }
function clock(t){
  if (t == null || t < 60) return "";
  var m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(3);
}
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

function penWords(r){
  var bits = [];
  if (r.cones) bits.push(plural(r.cones, "cone", "cones"));
  if (r.gates) bits.push(plural(r.gates, "missed gate", "missed gates"));
  if (r.dnf) bits.push("DNF");
  if (r.status && r.status !== "dnf") bits.push(r.status.toUpperCase());
  return bits.join(" + ");
}
function penMark(r){
  if (r.dnf) return "DNF";
  var n = r.cones + r.gates;
  return n ? "+" + n : "";
}
/* A driver's quickest run, penalties included, ignoring any run they did
   not finish. */
function bestRun(e){
  var t = e.runs.filter(function(r){ return r.time != null && !r.dnf; });
  if (!t.length) return null;
  return t.reduce(function(a, b){ return b.total < a.total ? b : a; });
}
function penaltyCount(e){
  return e.runs.reduce(function(n, r){
    return n + r.cones + r.gates + (r.dnf ? 1 : 0);
  }, 0);
}

/* ---------------------------------------------------------------- header */
/* The export's own name is often a slug, so prefer a supplied title. */
var EV_TITLE = EV.display_title ||
  [EV.organiser, EV.name].filter(Boolean).join(" · ") || EV.title;
document.title = EV_TITLE + " — Results";
document.getElementById("ev-title").textContent = EV_TITLE;
if (EV.venue) document.getElementById("ev-sub").dataset.venue = EV.venue;

var d = EV.date ? new Date(EV.date + "T12:00:00") : null;
var subParts = [];
if (d) subParts.push(d.toLocaleDateString(undefined,
  {weekday:"long", year:"numeric", month:"long", day:"numeric"}));
if (EV.venue) subParts.push(EV.venue);
document.getElementById("ev-sub").textContent = subParts.join(" · ");

var badges = document.getElementById("ev-badges");
[[plural(EV.entry_count, "entry", "entries"), 0],
 [plural(EV.class_count, "class", "classes"), 0],
 [plural(EV.run_count, "run", "runs"), 0],
 [RALLYX ? "Every run counts" : "Best run scores", 0],
 EV.runs_vary_by_entry ? ["Run count varies by entry", 1] : null
].filter(Boolean).forEach(function(b){
  badges.appendChild(el("span", "badge" + (b[1] ? " warn" : ""), b[0]));
});

/* ----------------------------------------------------------------- entry */
function entry(e, ctx){
  var row = el("article", "entry");
  row.id = ctx.idPrefix ? ctx.idPrefix + e.anchor : e.anchor;
  row.dataset.search = (e.driver + " " + e.car + " " + e.number + " " +
                        e.class + " " + (e.color || "")).toLowerCase();
  row.dataset.cls = e.class;

  var bodyId = "body-" + row.id;

  var head = el("div", "entry-head");
  head.setAttribute("role", "button");
  head.tabIndex = 0;
  head.setAttribute("aria-expanded", "false");
  head.setAttribute("aria-controls", bodyId);

  var rank = el("span", "rank" + (e.trophy ? " trophy" : ""), String(ctx.rank));
  if (e.trophy) rank.title = "Trophy position";
  head.appendChild(rank);

  var who = el("span", "who");
  who.appendChild(el("span", "name", e.driver));

  /* A plain anchor rather than a clipboard write: it needs no permission,
     works over http, and the browser puts the resulting address in the bar
     for the reader to copy. */
  var car = el("span", "car");
  car.appendChild(el("span", "cartext",
    (ctx.showClass ? e.class + " " : "") + "#" + e.number + " · " + e.car));
  var link = el("a", "linkbtn");
  link.href = "#" + e.anchor;
  link.title = "Link to this result";
  link.setAttribute("aria-label", "Link to " + e.driver + "'s result");
  link.innerHTML = LINK_ICON;
  car.appendChild(link);

  var cmp = el("button", "cmpbtn");
  cmp.type = "button";
  cmp.dataset.anchor = e.anchor;
  cmp.dataset.driver = e.driver;
  car.appendChild(cmp);
  who.appendChild(car);
  head.appendChild(who);

  /* PAX shows an indexed time in place of the raw total, so the headline
     figure is an option rather than always e.printed_total. */
  var shown = ctx.total != null ? ctx.total : e.printed_total;

  var times = el("span", "times");
  var tot = el("span", "total", fmt(shown));
  if (clock(shown)) tot.title = clock(shown);

  /* On the PAX board the row ends in the sum that produced the figure -
     raw time, index, result - so the arithmetic is visible rather than
     something a reader has to be told about. */
  if (ctx.equation){
    head.classList.add("has-eq");
    var eqline = el("span", "totline");
    var eq = el("span", "eq");
    eq.appendChild(el("span", "eq-n", ctx.equation.raw.toFixed(3)));
    eq.appendChild(el("span", "eq-op", "\u00d7"));
    eq.appendChild(el("span", "eq-n", ctx.equation.factor.toFixed(3)));
    eq.appendChild(el("span", "eq-op", "="));
    eqline.appendChild(eq);
    eqline.appendChild(tot);
    times.appendChild(eqline);
  } else {
    times.appendChild(tot);
  }
  /* A registered driver who never ran has no total, so they are neither a
     leader nor a gap - say what actually happened instead. */
  if (shown == null){
    times.appendChild(el("span", "gap nostart",
      (e.printed_total_raw || "no time").toUpperCase()));
  } else {
    times.appendChild(el("span", "gap" + (ctx.gap == null ? " lead" : ""),
                         ctx.gap == null ? ctx.leadLabel : signed(ctx.gap)));
  }
  head.appendChild(times);
  row.appendChild(head);

  var body = el("div", "entry-body");
  body.id = bodyId;

  var best = bestRun(e);
  var strip = el("div", "strip");
  e.runs.forEach(function(r, i){
    var cls = "run";
    if (r.dnf || r.time == null) cls += " dnf";
    else if (r.penalty > 0) cls += " pen";
    else if (best && r === best) cls += " best";
    /* In a comparison a run can also be the quickest of the group. Green
       wins that tie: a driver's own best is the more useful thing to see,
       and it is usually also the group's best, so letting gold take it
       erased the green marker on exactly the runs that mattered most.
       Gold therefore marks a run someone won that was not their own best. */
    if (ctx.winners && ctx.winners[i] != null &&
        r.time != null && !r.dnf && r.total === ctx.winners[i] &&
        !(best && r === best)){
      cls = "run win";
    }

    var chip = el("div", cls);
    chip.appendChild(el("span", "n", "R" + (i + 1)));
    chip.appendChild(el("span", "v", r.time == null
      ? (r.status || "—").toUpperCase() : r.time.toFixed(3)));
    var mark = penMark(r);
    if (mark) chip.appendChild(el("span", "p", mark));

    if (r.penalty > 0 && r.time != null){
      chip.title = penWords(r) + " · " + r.time.toFixed(3) + " + " +
                   r.penalty.toFixed(3) + " = " + r.total.toFixed(3);
    } else if (best && r === best){
      chip.title = "Their fastest run";
    }
    strip.appendChild(chip);
  });
  body.appendChild(strip);

  var line = el("div", "foot-line");
  if (ctx.note){
    var nt = el("span");
    nt.innerHTML = ctx.note;
    line.appendChild(nt);
  }
  if (best){
    var f = el("span");
    f.appendChild(document.createTextNode("Best run "));
    f.appendChild(el("b", null, best.total.toFixed(3)));
    /* Without this the score looks like it came from nowhere: the run
       prints as its clean time with a marker, and the total is the clean
       time plus the penalty. */
    if (best.penalty > 0){
      f.appendChild(document.createTextNode(" \u2014 "));
      f.appendChild(el("b", null, best.time.toFixed(3)));
      f.appendChild(document.createTextNode(" + "));
      f.appendChild(el("b", null, best.penalty.toFixed(3)));
      f.appendChild(document.createTextNode(" penalty"));
    }
    line.appendChild(f);
  }
  /* Shown only when the printed total exceeds the runs added up - which is
     exactly when a reader would otherwise think the maths is wrong. */
  if (RALLYX && e.penalty_total > 0){
    var s = el("span");
    s.appendChild(document.createTextNode("Raw "));
    s.appendChild(el("b", null, e.raw_total.toFixed(3)));
    s.appendChild(document.createTextNode(" + "));
    s.appendChild(el("b", null, e.penalty_total.toFixed(3)));
    s.appendChild(document.createTextNode(" in penalties = "));
    s.appendChild(el("b", null, fmt(e.printed_total)));
    line.appendChild(s);
  }
  body.appendChild(line);

  row.appendChild(body);
  return row;
}

/* ----------------------------------------------------- class roll-up head */
function classHead(cls){
  var h = el("button", "cls-head");
  h.type = "button";
  h.setAttribute("aria-expanded", "false");

  h.appendChild(el("span", "cls-code", cls.code));

  var main = el("span", "cls-main");
  main.appendChild(el("span", "cls-name", cls.name));

  var stats = el("span", "cls-stats");
  function stat(label, value, title){
    var x = el("span");
    if (title) x.title = title;
    x.appendChild(document.createTextNode(label + " "));
    x.appendChild(el("b", null, value));
    stats.appendChild(x);
  }

  var timed = cls.entries.filter(function(e){ return e.printed_total != null; });
  if (timed.length > 1){
    var spread = timed[timed.length - 1].printed_total - timed[0].printed_total;
    stat("Spread", spread.toFixed(3), "First to last in this class");
  }

  var fastest = null, fastestDriver = null;
  cls.entries.forEach(function(e){
    var b = bestRun(e);
    if (b && (fastest === null || b.total < fastest.total)){
      fastest = b; fastestDriver = e;
    }
  });
  if (fastest){
    stat("Fastest run", fastest.total.toFixed(3) + " " + fastestDriver.driver,
         "Quickest single run in this class");
  }

  var pens = cls.entries.reduce(function(n, e){ return n + penaltyCount(e); }, 0);
  var secs = cls.entries.reduce(function(n, e){ return n + e.penalty_total; }, 0);
  stat("Penalties", pens ? pens + " (+" + secs.toFixed(3) + ")" : "none",
       "Cones, missed gates and DNFs across the class");

  main.appendChild(stats);
  h.appendChild(main);

  h.appendChild(el("span", "cls-n", plural(cls.entries.length, "entry", "entries")));
  return h;
}

function plainHead(code, name, n){
  var h = el("div", "cls-head");
  h.appendChild(el("span", "cls-code", code));
  var main = el("span", "cls-main");
  main.appendChild(el("span", "cls-name", name));
  h.appendChild(main);
  if (n != null) h.appendChild(el("span", "cls-n", plural(n, "entry", "entries")));
  return h;
}

/* ------------------------------------------------------------ class pane */
var paneClass = document.getElementById("pane-class");
DATA.classes.forEach(function(cls){
  var sec = el("section", "cls");
  sec.dataset.cls = cls.code;
  sec.appendChild(classHead(cls));

  var timed = cls.entries.filter(function(e){ return e.printed_total != null; });
  var leader = timed.length ? timed[0].printed_total : null;
  cls.entries.forEach(function(e){
    sec.appendChild(entry(e, {
      rank: e.position,
      leadLabel: timed.length > 1 ? "class winner" : "only time",
      gap: (e.printed_total == null || leader == null || e.printed_total === leader)
             ? null : e.printed_total - leader
    }));
  });
  paneClass.appendChild(sec);
});

/* -------------------------------------------------------------- raw pane */
var paneRaw = document.getElementById("pane-raw");
(function(){
  var sec = el("section", "cls");
  sec.appendChild(plainHead("Raw", "Every entry, fastest first", DATA.raw.length));
  var leader = DATA.raw.length ? DATA.raw[0].printed_total : null;
  DATA.raw.forEach(function(e, i){
    sec.appendChild(entry(e, {
      rank: i + 1,
      idPrefix: "raw-",
      showClass: true,
      leadLabel: "fastest of the day",
      gap: (i === 0 || e.printed_total == null || leader == null)
             ? null : e.printed_total - leader
    }));
  });
  paneRaw.appendChild(sec);
})();

/* ------------------------------------------------------------------ ttod */
/* -------------------------------------------------------------- compare */
/* Every driver, keyed by anchor, so the comparison can pull people from any
   class without walking the DOM. */
var BY_ANCHOR = {};
DATA.classes.forEach(function(c){
  c.entries.forEach(function(e){ BY_ANCHOR[e.anchor] = e; });
});

var compareList = [];

function isCompared(a){ return compareList.indexOf(a) !== -1; }

function toggleCompare(a){
  var i = compareList.indexOf(a);
  if (i === -1) compareList.push(a); else compareList.splice(i, 1);
  renderCompare();
  syncCompareHash();
}

function paintCompareButtons(){
  document.querySelectorAll(".cmpbtn").forEach(function(b){
    var on = isCompared(b.dataset.anchor);
    b.classList.toggle("on", on);
    b.innerHTML = on ? CHECK_ICON : PLUS_ICON;
    b.title = on ? "Remove from comparison" : "Add to comparison";
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.setAttribute("aria-label",
      (on ? "Remove " : "Add ") + b.dataset.driver +
      (on ? " from" : " to") + " the comparison");
  });
}

/* The selection rides in the hash so a comparison can be shared, the same
   way a single driver's result can. */
function syncCompareHash(){
  var h = compareList.length ? "#compare=" + compareList.join(",") : " ";
  history.replaceState(null, "", compareList.length ? h : location.pathname);
}

function readCompareHash(){
  var m = /^#compare=(.+)$/.exec(location.hash);
  if (!m) return false;
  compareList = m[1].split(",").filter(function(a){ return BY_ANCHOR[a]; });
  return compareList.length > 0;
}

/* Fastest adjusted time on a given run among the compared drivers. A run
   nobody finished has no winner rather than a bogus one. */
function runWinners(entries, i){
  var best = null;
  entries.forEach(function(e){
    var r = e.runs[i];
    if (!r || r.time == null || r.dnf) return;
    if (best === null || r.total < best) best = r.total;
  });
  return best;
}

/* Deliberately not ".run": that class carries the chip styling used in the
   run strips, which turns a table cell into a flex box and stacks the
   columns. */
function renderCompare(){
  var pane = document.getElementById("pane-compare");
  var tab = document.getElementById("tab-compare");
  pane.textContent = "";

  tab.hidden = compareList.length === 0;
  tab.textContent = "Compare" + (compareList.length ? " (" + compareList.length + ")" : "");
  if (!compareList.length){
    if (!document.getElementById("pane-compare").hidden) show("class");
    paintCompareButtons();
    return;
  }

  var entries = compareList.map(function(a){ return BY_ANCHOR[a]; })
                         .filter(Boolean)
                         .sort(function(a, b){ return a.printed_total - b.printed_total; });
  var leader = entries[0].printed_total;

  var head = el("div", "cls-head");
  head.appendChild(el("span", "cls-code", "VS"));
  var main = el("span", "cls-main");
  main.appendChild(el("span", "cls-name", "Compare"));
  var stats = el("span", "cls-stats");
  var sp = el("span");
  sp.appendChild(document.createTextNode("Spread "));
  sp.appendChild(el("b", null,
    (entries[entries.length - 1].printed_total - leader).toFixed(3)));
  stats.appendChild(sp);
  var lg = el("span");
  lg.appendChild(document.createTextNode(
    "Green is a driver's own best run, gold the quickest of the group on that run"));
  stats.appendChild(lg);
  main.appendChild(stats);
  head.appendChild(main);
  head.appendChild(el("span", "cls-n", plural(entries.length, "driver", "drivers")));
  pane.appendChild(head);

  /* The comparison is the same driver row as everywhere else. A matrix of
     runs across the page cannot survive a twelve-run event, and a second
     layout for the same information is one more thing to keep in step. */
  var winners = [];
  for (var i = 0; i < EV.run_count; i++) winners.push(runWinners(entries, i));

  entries.forEach(function(e, i){
    var row = entry(e, {
      rank: i + 1,
      idPrefix: "compare-",
      showClass: true,
      winners: winners,
      leadLabel: "fastest here",
      gap: e.printed_total === leader ? null : e.printed_total - leader
    });
    /* Open on arrival - the runs are the reason to be here. */
    setEntry(row, true);
    pane.appendChild(row);
  });

  /* Paint after building, never before: rows created by this pass have
     empty controls until they are painted, which is what left the compare
     pane with blank buttons and no way to remove anyone from it. */
  paintCompareButtons();
  sizeFirstColumn();

  var clear = el("div", "cmp-clear");
  var btn = el("button", "cmp-clear-btn", "Clear comparison");
  btn.type = "button";
  btn.id = "clear-compare";
  clear.appendChild(btn);
  pane.appendChild(clear);
}

/* ------------------------------------------------------------------ pax */
/* Autocross only: RallyCross has no index. The PAX export carries no run
   data, so entries are matched back to the class results by anchor and the
   ordinary row is reused with the indexed time as its headline figure. */
(function(){
  var pax = (DATA.pax || []).filter(function(p){
    /* A factor of zero means the class is not indexed - Novice, usually -
       so those rows carry no meaningful PAX time. */
    return p.factor > 0 && p.pax_time > 0;
  });
  if (!pax.length) return;

  var pane = document.getElementById("pane-pax");
  var tab = document.getElementById("tab-pax");
  tab.hidden = false;

  var head = plainHead("PAX", "Every entry on index, fastest first", pax.length);
  pane.appendChild(head);

  var lead = pax[0].pax_time;
  pax.forEach(function(p, i){
    var e = BY_ANCHOR[p.anchor];
    if (!e) return;
    pane.appendChild(entry(e, {
      rank: p.pax_position,
      idPrefix: "pax-",
      showClass: true,
      total: p.pax_time,
      leadLabel: "fastest on index",
      gap: i === 0 ? null : p.pax_time - lead,
      equation: {raw: p.total, factor: p.factor}
    }));
  });

  var skipped = (DATA.pax || []).length - pax.length;
  if (skipped){
    var n = el("div", "pane-note",
      plural(skipped, "entry", "entries") + " in unindexed classes are not " +
      "listed here - they appear in the class results.");
    pane.appendChild(n);
  }
})();

/* ----------------------------------------------------------------- tabs */
var tabs = {
  "class": {btn: document.getElementById("tab-class"), pane: paneClass},
  "raw":   {btn: document.getElementById("tab-raw"),   pane: paneRaw},
  "pax":   {btn: document.getElementById("tab-pax"),
            pane: document.getElementById("pane-pax")},
  "compare": {btn: document.getElementById("tab-compare"),
            pane: document.getElementById("pane-compare")}
};
function show(which){
  Object.keys(tabs).forEach(function(k){
    var on = k === which;
    tabs[k].btn.setAttribute("aria-selected", on ? "true" : "false");
    tabs[k].pane.hidden = !on;
  });
}
tabs["class"].btn.addEventListener("click", function(){ show("class"); });
tabs["raw"].btn.addEventListener("click", function(){ show("raw"); });
tabs["pax"].btn.addEventListener("click", function(){ show("pax"); });
tabs["compare"].btn.addEventListener("click", function(){ show("compare"); });

/* ------------------------------------------------------------- expanding */
var runsBox = document.getElementById("showruns");

function setEntry(row, open){
  if (row.classList.contains("static")) return;
  row.classList.toggle("open", open);
  var head = row.querySelector(".entry-head");
  if (head) head.setAttribute("aria-expanded", open ? "true" : "false");
}
function setClass(sec, open){
  sec.classList.toggle("open", open);
  var head = sec.querySelector(".cls-head");
  if (head.tagName === "BUTTON") head.setAttribute("aria-expanded", open ? "true" : "false");
  sec.querySelectorAll(".entry").forEach(function(row){ setEntry(row, open); });
}
function setAll(open){
  document.querySelectorAll(".cls").forEach(function(sec){ setClass(sec, open); });
}

/* Reflect reality on the master switch: mixed state reads as indeterminate
   rather than lying in either direction. */
function syncMaster(){
  var rows = document.querySelectorAll(".entry:not(.static)");
  var open = document.querySelectorAll(".entry.open:not(.static)").length;
  runsBox.indeterminate = open > 0 && open < rows.length;
  runsBox.checked = open === rows.length && rows.length > 0;
}
function syncClass(sec){
  var rows = sec.querySelectorAll(".entry:not(.static)");
  if (!rows.length) return;
  var open = sec.querySelectorAll(".entry.open:not(.static)").length;
  sec.classList.toggle("open", open === rows.length);
  var head = sec.querySelector(".cls-head");
  if (head.tagName === "BUTTON"){
    head.setAttribute("aria-expanded", open === rows.length ? "true" : "false");
  }
}

document.addEventListener("click", function(ev){
  /* Let the browser follow the anchor, but keep the click from also
     toggling the row it sits in. */
  if (ev.target.closest && ev.target.closest(".linkbtn")){
    ev.stopPropagation();
    return;
  }

  var cmp = ev.target.closest && ev.target.closest(".cmpbtn");
  if (cmp){
    ev.preventDefault();
    ev.stopPropagation();
    toggleCompare(cmp.dataset.anchor);
    return;
  }

  if (ev.target.closest && ev.target.closest("#clear-compare")){
    compareList = [];
    renderCompare();
    syncCompareHash();
    show("class");
    return;
  }

  var clsHead = ev.target.closest && ev.target.closest("button.cls-head");
  if (clsHead){
    var sec = clsHead.closest(".cls");
    setClass(sec, !sec.classList.contains("open"));
    syncMaster();
    return;
  }

  var head = ev.target.closest && ev.target.closest(".entry-head");
  if (head){
    var row = head.closest(".entry");
    setEntry(row, !row.classList.contains("open"));
    syncClass(row.closest(".cls"));
    syncMaster();
  }
});

/* The header is a div so it can contain a button, so it needs the keyboard
   behaviour a real button would have given it for free. */
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
  var head = ev.target.closest && ev.target.closest(".entry-head");
  if (!head || ev.target.closest(".linkbtn")) return;
  ev.preventDefault();
  var row = head.closest(".entry");
  setEntry(row, !row.classList.contains("open"));
  syncClass(row.closest(".cls"));
  syncMaster();
});

/* Runs are open by default where there is room for them and rolled up where
   there is not, but the control and the behaviour are the same either way.

   The preference is remembered separately for wide and narrow layouts, so a
   choice made at a desk does not follow the reader onto a phone - and so
   that crossing the breakpoint, by rotating a tablet or by dragging a window
   narrow, re-applies the default for the width you have just moved into. */
var WIDE = window.matchMedia("(min-width: 820px)");

function prefKey(wide){ return wide ? "rx-runs-wide" : "rx-runs-narrow"; }

/* Rolled up by default at every width: the standings are what people came
   for, and a reader who wants the runs asks for them. A choice made with
   the Runs switch is remembered, separately per width. */
function defaultFor(wide){
  try {
    var saved = localStorage.getItem(prefKey(wide));
    if (saved !== null) return saved === "1";
  } catch (err) {}
  return false;
}

function applyForWidth(){
  setAll(defaultFor(WIDE.matches));
  syncMaster();
}

runsBox.addEventListener("change", function(){
  setAll(runsBox.checked);
  runsBox.indeterminate = false;
  try {
    localStorage.setItem(prefKey(WIDE.matches), runsBox.checked ? "1" : "0");
  } catch (err) {}
});

if (WIDE.addEventListener) WIDE.addEventListener("change", applyForWidth);
else if (WIDE.addListener) WIDE.addListener(applyForWidth);

applyForWidth();

/* The first column has to hold the widest chip in its own pane, and what
   that is differs: two characters among the class codes, three for "PAX",
   two for "VS". Panes are never on screen together, so each sizes its own
   column rather than the widest chip anywhere setting the width for all of
   them. Codes are measured in the font they are drawn in, not guessed at,
   and this runs after every render so a pane built later is sized too. */
function sizeFirstColumn(){
  var sample = document.querySelector(".cls-code");
  if (!sample) return;
  var cs = getComputedStyle(sample);

  var probe = document.createElement("span");
  probe.style.cssText = "position:absolute;left:-9999px;top:0;white-space:pre;" +
    "font:" + cs.font + ";letter-spacing:" + cs.letterSpacing +
    ";text-transform:" + cs.textTransform;
  document.body.appendChild(probe);

  [paneClass, paneRaw, document.getElementById("pane-pax"),
   document.getElementById("pane-compare")].forEach(function(pane){
    if (!pane) return;
    var widest = 0;
    pane.querySelectorAll(".cls-code").forEach(function(n){
      probe.textContent = n.textContent;
      widest = Math.max(widest, probe.getBoundingClientRect().width);
    });
    /* Position numbers share the column, so never go below what they need. */
    pane.style.setProperty("--col-rank",
      Math.max(24, Math.ceil(widest) + 12) + "px");
  });

  document.body.removeChild(probe);
}
sizeFirstColumn();

/* --------------------------------------------------------------- filters */
var q = document.getElementById("q");
var cf = document.getElementById("clsfilter");
var countEl = document.getElementById("count");

cf.appendChild(new Option("All classes", ""));
DATA.classes.forEach(function(c){ cf.appendChild(new Option(c.code + " — " + c.name, c.code)); });

function applyFilter(){
  var term = q.value.trim().toLowerCase();
  var cls = cf.value;
  var shown = 0;

  document.querySelectorAll(".entry[data-search]").forEach(function(n){
    var ok = (!term || n.dataset.search.indexOf(term) !== -1) &&
             (!cls || n.dataset.cls === cls);
    n.hidden = !ok;
    if (ok) shown++;
  });
  document.querySelectorAll(".cls[data-cls]").forEach(function(sec){
    sec.hidden = !sec.querySelector(".entry:not([hidden])");
  });

  countEl.textContent = (term || cls)
    ? (shown ? plural(shown, "result", "results") : "nothing found")
    : "";
}
q.addEventListener("input", applyFilter);
cf.addEventListener("change", applyFilter);

/* ------------------------------------------------------------ deep links */
function openHash(){
  var h = location.hash.slice(1);
  if (!h) return;
  if (h.indexOf("compare=") === 0){
    if (readCompareHash()){ renderCompare(); show("compare"); }
    return;
  }
  if (h === "raw"){ show("raw"); return; }
  var node = document.getElementById(h) || document.getElementById("raw-" + h);
  if (!node) return;
  show(node.closest("#pane-raw") ? "raw" : "class");
  setEntry(node, true);
  syncClass(node.closest(".cls"));
  syncMaster();
  setTimeout(function(){ node.scrollIntoView({block:"center"}); }, 0);
}
window.addEventListener("hashchange", openHash);

/* ----------------------------------------------------------------- foot */
var foot = document.getElementById("foot");

foot.appendChild(el("h2", null, "Reading a run"));
var key = el("div", "key");
[["", "R3", "44.244", "", "a clean run"],
 ["best", "R7", "39.939", "", "their fastest run"],
 ["pen", "R5", "42.397", "+1", "a run with a penalty"],
 ["dnf", "R8", "87.714", "DNF", "did not finish"]
].forEach(function(k){
  var chip = el("div", "run" + (k[0] ? " " + k[0] : ""));
  chip.appendChild(el("span", "n", k[1]));
  chip.appendChild(el("span", "v", k[2]));
  if (k[3]) chip.appendChild(el("span", "p", k[3]));
  chip.title = k[4];
  key.appendChild(chip);
});
foot.appendChild(key);

foot.appendChild(el("h2", null, "How the times work"));
var ul = el("ul");
[ "Tap a driver to open their runs. Tap a class heading to open every driver in it. " +
    "The Runs switch above opens or closes the lot.",
  RALLYX
    ? "Every run counts. A driver's total is all " + EV.run_count +
      " runs added together, plus penalties — there are no drop runs."
    : "The score is the single fastest run of the day, penalties included.",
  "Run times are printed exactly as the official results show them: the clean time, " +
    "then its penalty marker. A marker of +2 means two cones, not two seconds.",
  "A cone costs " + EV.penalties.cone_seconds.toFixed(0) + " seconds. A missed gate costs " +
    EV.penalties.gate_seconds.toFixed(0) + " seconds. A DNF is scored as " +
    plural(EV.penalties.dnf_cones, "cone", "cones") + ", or " +
    EV.penalties.dnf_seconds.toFixed(0) + " seconds.",
  "A gold position number marks a trophy position.",
  (DATA.pax && DATA.pax.length)
    ? "The PAX tab ranks everyone on index: each class's raw time multiplied " +
      "by its factor, which is how classes are compared to one another."
    : null,
  "Open a driver to reveal two controls beside their car: a link to their " +
    "result, and a plus that adds them to the comparison. Compare puts any " +
    "drivers you pick side by side run by run, across classes, and its own " +
    "address can be shared.",
  "The link icon after a driver's car jumps to their result and puts its " +
    "address in the address bar, ready to copy and share."
].filter(Boolean).forEach(function(t){ ul.appendChild(el("li", null, t)); });
foot.appendChild(ul);

if (EV.note) foot.appendChild(el("div", null, "Timing note: " + EV.note));
foot.appendChild(el("div", null, "Timing by AXWare Systems. Page generated __GENERATED__."));

renderCompare();

show("class");
openHash();
})();
</script>
